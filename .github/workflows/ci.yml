name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-baseline:
    name: Production Baseline Validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm

      - name: Verify runner contract
        shell: bash
        run: |
          set -euo pipefail

          test "$(uname -m)" = "x86_64"
          test "${RUNNER_ARCH}" = "X64"

          node --version
          npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Quality Gate
        run: npm run quality:gate

      - name: Full Engineering Gate
        run: npm run gate:full

      - name: Canonical Test Suite
        run: npm test
