// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

def capacitorVersionProperties = [
    "androidxActivityVersion": rootProject.ext.androidxActivityVersion,
    "androidxAppCompatVersion": rootProject.ext.androidxAppCompatVersion,
    "androidxCoordinatorLayoutVersion": rootProject.ext.androidxCoordinatorLayoutVersion,
    "androidxCoreVersion": rootProject.ext.androidxCoreVersion,
    "androidxFragmentVersion": rootProject.ext.androidxFragmentVersion,
    "androidxWebkitVersion": rootProject.ext.androidxWebkitVersion,
    "junitVersion": rootProject.ext.junitVersion,
    "androidxJunitVersion": rootProject.ext.androidxJunitVersion,
    "androidxEspressoCoreVersion": rootProject.ext.androidxEspressoCoreVersion,
    "cordovaAndroidVersion": rootProject.ext.cordovaAndroidVersion,
    "compileSdkVersion": rootProject.ext.compileSdkVersion,
    "minSdkVersion": rootProject.ext.minSdkVersion,
    "targetSdkVersion": rootProject.ext.targetSdkVersion
]

gradle.beforeProject { project ->
    capacitorVersionProperties.each { key, value ->
        if (!project.ext.has(key)) {
            project.ext.set(key, value)
        }
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
